# SchooKeep backend stack: Laravel API + MySQL.
# Usage:  docker compose up --build      (API → http://localhost:8000)
services:
  app:
    build: .
    container_name: schookeep_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Container env overrides .env (Laravel's Dotenv is immutable).
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: schookeep
      DB_USERNAME: schookeep
      DB_PASSWORD: secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: schookeep_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: schookeep
      MYSQL_USER: schookeep
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306" # host 3307 to avoid clashing with a local MySQL on 3306
    volumes:
      - schookeep_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  schookeep_db:
